{% url 'core:inicio' as inicio %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 Error | Rentis</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f4f7fb;
            color: #12304a;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        main {
            box-sizing: border-box;
            width: min(90%, 520px);
            padding: 2.5rem 1.5rem;
            border: 1px solid #dce5ef;
            border-radius: 18px;
            background: #fff;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.5rem, 9vw, 4rem);
        }

        .boton-inicio {
            display: inline-flex;
            align-items: center;
            min-height: 48px;
            padding-inline: 1.25rem;
            border-radius: 10px;
            background: #185fa5;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }

        .boton-inicio:hover {
            background: #123e6a;
        }

        .boton-inicio:focus-visible {
            outline: 3px solid #185fa5;
            outline-offset: 4px;
        }
    </style>
</head>
<body>
    <main>
        <h1>404 Error</h1>
        <p>La página que buscas no existe.</p>
        <a class="boton-inicio" href="{{ inicio|default:'/' }}">Volver al inicio</a>
    </main>
</body>
</html>
